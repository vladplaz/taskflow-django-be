name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on main: cancelling mid-deploy leaves the migration job run and the
  # service revision out of step with each other.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # A real PostgreSQL: the schema uses functional unique indexes and
      # SELECT ... FOR UPDATE, neither of which SQLite exercises.
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_local_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5434
      POSTGRES_PASSWORD: taskflow_local_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python manage.py test

      - name: Generate the OpenAPI schema
        # --fail-on-warn: an endpoint the generator cannot describe is a
        # real gap in the client's contract.
        run: python manage.py spectacular --file schema.yaml --fail-on-warn

      - name: Deployment checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: taskflow.settings.prod
          # Satisfies security.W009; signs nothing, the step just boots.
          DJANGO_SECRET_KEY: ${{ github.sha }}-vK3qZ8mTb7Lx0PwR2neJcYgH5dAsUf6i
          DJANGO_ALLOWED_HOSTS: example.com
          REDIS_URL: redis://localhost:6379/0
          EMAIL_HOST: smtp.example.com

      - name: Audit dependencies
        # Runtime only: a dev-tool advisory is not shipped to anyone.
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  deploy:
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Two quick pushes queue rather than race onto the same service.
    concurrency:
      group: deploy-cloud-run
      cancel-in-progress: false

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      # Mints the OIDC token Google exchanges for credentials.
      id-token: write

    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/backend

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Native on the x86_64 runner; Cloud Run rejects arm64.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Before the service, against the revision still serving: correct for
      # additive migrations, not for destructive ones.
      - name: Migrate
        run: |
          gcloud run jobs update ${{ vars.CLOUD_RUN_MIGRATE_JOB }} \
            --region ${{ vars.GCP_REGION }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}
          gcloud run jobs execute ${{ vars.CLOUD_RUN_MIGRATE_JOB }} \
            --region ${{ vars.GCP_REGION }} --wait

      # No traffic until the candidate answers /health, so a revision that
      # cannot boot never reaches a user. Only the image changes: env vars
      # and secrets stay as configured, so a merge cannot revert config.
      - name: Deploy the candidate revision
        id: candidate
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} \
            --region ${{ vars.GCP_REGION }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --no-traffic --tag candidate --quiet
          url=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} \
            --region ${{ vars.GCP_REGION }} --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Candidate serving at $url"

      # The tagged URL is a different hostname: it must be in
      # DJANGO_ALLOWED_HOSTS or Django answers 400.
      - name: Check the candidate before it takes traffic
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "${{ steps.candidate.outputs.url }}/health" | grep -q '"ok"'; then
              echo "candidate is healthy"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "::error::Candidate never answered /health. Traffic was not moved and the"
          echo "::error::previous revision is still serving. Check the Cloud Run logs."
          exit 1

      - name: Promote the candidate
        id: deploy
        run: |
          gcloud run services update-traffic ${{ vars.CLOUD_RUN_SERVICE }} \
            --region ${{ vars.GCP_REGION }} --to-latest --quiet
          echo "url=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} \
            --region ${{ vars.GCP_REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"
